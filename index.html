<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/69a7d073cd7cd9b51cfe0fd0/4aafe06dc_generated_image.png" />
    <link rel="apple-touch-icon" href="https://media.base44.com/images/public/69a7d073cd7cd9b51cfe0fd0/4aafe06dc_generated_image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Explore Crete — walking tours, hiking routes, and driving audio tours across Crete, Greece." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Explore Crete" />
    <title>Explore Crete</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Check exactly once, right when the app opens — this is the ONLY check that
            // should ever surface the update banner, full stop. There used to also be a
            // setInterval polling every 60 seconds (removed previously — that was the
            // direct cause of the banner interrupting Enda mid-recording), AND a
            // visibilitychange listener re-checking whenever the tab regained focus. That
            // second one was reasoned as "a genuine reopen moment" — it isn't. Switching to
            // another tab or app to check something (a reference doc, a script file) and
            // coming back is completely ordinary mid-task behavior, not the same as closing
            // and reopening the app, and could interrupt active work exactly the same way
            // the 60-second poll did. Removed too. Nothing after this one call ever
            // triggers another check for the rest of this page's lifetime — only an actual
            // fresh load (a real reopen, or a normal browser refresh) checks again.
            reg.update().catch(() => {});
          }).catch(() => {});
        });
        // A new service worker has activated in the background (see public/sw.js) — this
        // used to reload the page immediately and silently the instant that happened,
        // with zero warning, which could land mid-task for anyone with the app left open
        // (a narrator mid-recording, an admin mid-edit) and lose whatever wasn't saved
        // yet. Now it just tells the React app a new version exists; the app decides when
        // it's actually safe to reload (see src/components/UpdateAvailableToast.jsx),
        // which for a first-time open or a normal closed-then-reopened app is a no-op
        // anyway — navigation requests are network-first (see sw.js), so those already
        // get the latest version automatically with nothing to click.
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'SW_UPDATED') {
            window.dispatchEvent(new CustomEvent('explore-crete:update-available'));
          }
        });
      }
    </script>
  </body>
</html>
